# Opt in: docker compose -f compose.yaml -f docker/compose.mobile.yaml ...
services:
  monito:
    environment:
      ADB_SERVER_SOCKET: tcp:mobile:5037
      APPIUM_URL: http://mobile:4723
    depends_on:
      mobile:
        condition: service_healthy
    networks:
      mobile: {}
  mobile:
    image: ${IMAGE_PREFIX:-}monito-mobile:${RELEASE_VERSION:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.mobile
    init: true
    restart: unless-stopped
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    group_add:
      - "${ADB_USB_GID:?Set ADB_USB_GID to the host USB access group GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    tmpfs: [/tmp]
    volumes:
      - type: bind
        source: ${ADB_HOME_HOST_DIR:-./data/adb/home}
        target: /data/home
        bind:
          create_host_path: false
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
        bind:
          create_host_path: false
    # Major 189 is USB. Wildcard minors allow reconnects without recreation;
    # host device permissions still apply. This exposes the USB tree, not just one phone.
    device_cgroup_rules: ["c 189:* rw"]
    networks: [mobile]
networks:
  mobile:
    internal: true

# Neither 5037 nor 4723 is published.
# No published ports. Only Monito and mobile join this network.
# HOME/.android stores the server's authorization keys; Monito needs no keys.
# Explicit remote ADB connections do not use a separate local ADB daemon.
