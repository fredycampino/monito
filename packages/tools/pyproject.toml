[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggets"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
description = "Independent tools exposed through CLI and HTTP"

[project.scripts]
ggets = "ggets.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>.+)'

[tool.hatch.build.targets.wheel]
packages = ["src/ggets"]
exclude = ["src/ggets/**/tests/**"]
