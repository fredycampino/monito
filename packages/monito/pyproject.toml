[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monito"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["skiller==0.1.0-beta.45"]
description = "Minimal Monito developer agent"

[project.scripts]
monito = "monito.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>.+)'

[tool.hatch.build.targets.wheel]
packages = ["src/monito"]

[tool.hatch.build.targets.wheel.force-include]
"monito.yaml" = "packages/monito/monito.yaml"
"system.md" = "packages/monito/system.md"
"instructions" = "packages/monito/instructions"

[tool.hatch.build.targets.sdist.force-include]
"../webhook/webhook.yaml" = "webhook/webhook.yaml"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
