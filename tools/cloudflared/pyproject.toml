[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "sk-cloudflared"
dynamic = ["version"]
description = "Cloudflared login CLI for Monito agents"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.15.4",
]

[project.scripts]
sk-cloudflared = "sk_cloudflared.cli:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/sk_cloudflared"]

[tool.hatch.build.targets.wheel.force-include]
"agent" = "sk_cloudflared/agent"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
