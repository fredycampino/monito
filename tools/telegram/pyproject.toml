[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "sk-telegram"
dynamic = ["version"]
description = "Telegram input/output CLI for Skiller agents"
readme = "user-guide-sk-telegram.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot>=21.0,<23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.15.4",
]

[project.scripts]
sk-telegram = "sk_telegram.cli:main"

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/sk_telegram"]

[tool.hatch.build.targets.wheel.force-include]
"agent" = "sk_telegram/agent"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
