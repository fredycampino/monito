name: telegrambot
description: "Webhook-driven conversational Telegram agent"
version: "0.1"
start: wait_telegram

inputs: {}

steps:
  - wait_webhook: wait_telegram
    webhook: telegram
    key: inbox
    next: route_message

  - when: route_message
    value: '{{output_value("wait_telegram").payload.message.text?}}'
    branches:
      - ne: null
        then: message_telegram
    default: wait_telegram

  - assign: message_telegram
    values:
      update_id: '{{output_value("wait_telegram").payload.update_id}}'
      message:
        message_id: '{{output_value("wait_telegram").payload.message.message_id}}'
        from:
          is_bot: '{{output_value("wait_telegram").payload.message.from.is_bot}}'
          username: '{{output_value("wait_telegram").payload.message.from.username}}'
        chat:
          id: '{{output_value("wait_telegram").payload.message.chat.id}}'
          type: '{{output_value("wait_telegram").payload.message.chat.type}}'
        date: '{{output_value("wait_telegram").payload.message.date}}'
        text: '{{output_value("wait_telegram").payload.message.text}}'
    next: telegram_agent

  - agent: telegram_agent
    system:
      file: "./system.md"
    task: |
      Reply to this Telegram message:
      {{output_value("message_telegram").assigned}}
    max_turns: 1
    next: send_telegram

  - shell: send_telegram
    env:
      SK_TELEGRAM_CHAT_ID: '{{output_value("message_telegram").assigned.message.chat.id}}'
      SK_TELEGRAM_REPLY_TEXT: '{{output_value("telegram_agent").data.final}}'
    command: uv run sk-telegram send --from-env
    check: true
    next: wait_telegram
