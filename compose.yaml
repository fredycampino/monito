services:
  box:
    build:
      context: .
    image: monito-box:dev
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      HOME: /data/home
      AGENT_DB_PATH: /data/skiller/agent.db
      MONITO_AGENT_CONFIG_FILE: /opt/monito/monito/agent.box.json
      # Preserve the host terminal capabilities for Textual/STUI.
      TERM: "${TERM:-xterm-256color}"
      COLORTERM: "${COLORTERM:-truecolor}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/home /data/skiller /data/workspace && exec sleep infinity"]
    init: true
    stdin_open: true
    tty: true
